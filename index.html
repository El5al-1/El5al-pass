<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0E0D08" />
<title>EL5AL PASS — Collections</title>
<style>
:root{
  --bg:#0E0D08;
  --bg-soft:#12110A;
  --surface:#17160E;
  --surface-2:#1E1D13;
  --surface-3:#252419;
  --line:rgba(255,255,255,.085);
  --line-strong:rgba(255,255,255,.16);
  --lime:#A3E635;
  --lime-dim:rgba(163,230,53,.12);
  --text:#F5F4EC;
  --muted:#95948A;
  --muted-2:#6C6B61;
  --danger:#FF6B6B;
  --radius:22px;
  --shadow:0 18px 50px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Inter","Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
  background-image:radial-gradient(900px 480px at 78% -10%,rgba(163,230,53,.075),transparent 65%),radial-gradient(600px 400px at 5% 100%,rgba(163,230,53,.035),transparent 70%);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
input,textarea,select{outline:none}
::selection{background:rgba(163,230,53,.3)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#343326;border-radius:20px}
::-webkit-scrollbar-track{background:transparent}
.svg-sprite{position:absolute;width:0;height:0;overflow:hidden}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:15px;height:15px}
.ic.lg{width:22px;height:22px}

/* ---------- shell ---------- */
.app-shell{display:grid;grid-template-columns:266px minmax(0,1fr);min-height:100dvh}
.sidebar{
  position:sticky;top:0;height:100dvh;overflow-y:auto;
  background:#100F09;border-right:1px solid var(--line);
  padding:26px 16px 20px;display:flex;flex-direction:column;gap:26px;z-index:40;
}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px}
.brand-mark{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;
  background:linear-gradient(145deg,#B9F34A,#7FB623);color:#10130A;
  box-shadow:0 8px 22px rgba(163,230,53,.22);
}
.brand-mark .ic{width:23px;height:23px;stroke-width:2.2}
.brand-name{font-size:16px;font-weight:800;letter-spacing:.14em;line-height:1.1}
.brand-sub{font-size:9.5px;letter-spacing:.28em;color:var(--lime);margin-top:4px;font-weight:700;text-transform:uppercase}
.side-label{font-size:10px;letter-spacing:.19em;color:var(--muted-2);font-weight:800;text-transform:uppercase;padding:0 12px;margin-bottom:10px}
.nav-stack{display:flex;flex-direction:column;gap:4px}
.nav-item{
  width:100%;display:flex;align-items:center;gap:11px;padding:11px 12px;border:0;border-radius:13px;
  background:transparent;color:var(--muted);font-weight:600;font-size:13.5px;text-align:left;position:relative;transition:.16s;
}
.nav-item:hover{background:rgba(255,255,255,.045);color:var(--text)}
.nav-item.active{background:var(--lime-dim);color:var(--lime)}
.nav-item.active:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:4px;background:var(--lime)}
.nav-item .ic{width:17px;height:17px}
.nav-count{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted-2);background:rgba(255,255,255,.05);padding:2px 8px;border-radius:20px}
.nav-item.active .nav-count{color:var(--lime);background:rgba(163,230,53,.14)}
.side-collections{display:flex;flex-direction:column;gap:2px;overflow-y:auto;max-height:38vh}
.side-collection{width:100%;display:flex;align-items:center;gap:10px;padding:8px 12px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:13px;text-align:left;transition:.15s}
.side-collection:hover,.side-collection.active{background:rgba(255,255,255,.05);color:var(--text)}
.side-collection .cdot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
.side-collection span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.side-collection small{color:var(--muted-2);font-size:11px}
.side-empty{color:var(--muted-2);font-size:12px;padding:6px 12px;line-height:1.6}
.side-footer{margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}
.storage-note{display:flex;align-items:center;gap:9px;padding:10px 12px;margin-bottom:10px;border-radius:13px;background:rgba(163,230,53,.06);color:var(--muted);font-size:11.5px;line-height:1.45}
.storage-note .ic{color:var(--lime);width:16px;height:16px}
.footer-actions{display:flex;gap:8px}
.footer-actions button{flex:1}

/* ---------- topbar ---------- */
.main-wrap{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  padding:19px 34px 17px;border-bottom:1px solid var(--line);
  background:rgba(14,13,8,.86);backdrop-filter:blur(18px);
}
.tb-left{display:flex;align-items:center;gap:14px;min-width:220px;flex:1}
.tb-crumb{margin:0;color:var(--lime);font-size:10px;letter-spacing:.2em;font-weight:800;text-transform:uppercase}
.tb-title{margin:3px 0 0;font-size:23px;line-height:1.15;font-weight:800;letter-spacing:-.035em}
.tb-sub{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.tb-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.global-search{
  display:flex;align-items:center;gap:9px;width:min(290px,42vw);height:42px;padding:0 12px;
  background:var(--surface);border:1px solid var(--line);border-radius:13px;color:var(--muted-2);transition:.18s;
}
.global-search:focus-within{border-color:rgba(163,230,53,.55);box-shadow:0 0 0 3px rgba(163,230,53,.09)}
.global-search input{flex:1;min-width:0;border:0;background:transparent;font-size:13px;color:var(--text)}
.global-search input::placeholder{color:var(--muted-2)}
.kbd{font-size:10px;border:1px solid var(--line-strong);border-radius:5px;padding:1px 5px;color:var(--muted-2);white-space:nowrap}
#topActions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.menu-btn{display:none}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:10px 15px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--text);font-size:12.5px;font-weight:700;
  white-space:nowrap;transition:.16s;
}
.btn:hover{border-color:var(--line-strong);transform:translateY(-1px);background:var(--surface-3)}
.btn.primary{background:var(--lime);color:#111605;border-color:var(--lime);box-shadow:0 8px 22px rgba(163,230,53,.18)}
.btn.primary:hover{background:#B4F04C;box-shadow:0 10px 26px rgba(163,230,53,.28)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:rgba(255,107,107,.3);background:rgba(255,107,107,.07)}
.btn.danger:hover{background:rgba(255,107,107,.14)}
.btn.sm{padding:7px 11px;font-size:11.5px;border-radius:10px}
.btn.block{width:100%}
.icon-btn{
  width:36px;height:36px;display:grid;place-items:center;border-radius:11px;border:1px solid var(--line);
  background:var(--surface);color:var(--muted);transition:.15s;flex:none;
}
.icon-btn:hover{color:var(--lime);border-color:rgba(163,230,53,.4)}
.icon-btn.lime{color:var(--lime)}
.icon-btn.small{width:31px;height:31px;border-radius:9px}
.icon-btn.small .ic{width:15px;height:15px}
.icon-btn.plain{border:0;background:transparent}
.segmented{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.segmented button{border:0;background:transparent;color:var(--muted);width:33px;height:29px;border-radius:9px;display:grid;place-items:center}
.segmented button.active{background:var(--lime-dim);color:var(--lime)}

/* ---------- content ---------- */
.content{padding:28px 34px 90px;max-width:1380px;width:100%;margin:0 auto;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{
  position:relative;overflow:hidden;border:1px solid var(--line);border-radius:26px;padding:30px 32px;margin-bottom:28px;
  background:linear-gradient(120deg,#1C2110 0%,#17160E 55%,#121109 100%);
}
.hero:after{content:"";position:absolute;right:-70px;top:-130px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(163,230,53,.19),transparent 68%);pointer-events:none}
.hero:before{content:"";position:absolute;right:90px;bottom:-150px;width:280px;height:280px;border:1px solid rgba(163,230,53,.12);border-radius:50%;pointer-events:none}
.hero-eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--lime);font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin-bottom:12px}
.hero h2{margin:0;font-size:clamp(24px,3vw,34px);letter-spacing:-.045em;line-height:1.15;font-weight:800;max-width:560px}
.hero p{margin:10px 0 0;color:var(--muted);font-size:13px;max-width:520px;line-height:1.65}
.hero-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;position:relative;z-index:2}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:30px}
.stat{border:1px solid var(--line);background:var(--surface);border-radius:19px;padding:17px 19px}
.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.stat-top .ic{color:var(--lime);opacity:.85;width:16px;height:16px}
.stat strong{display:block;font-size:27px;font-weight:800;letter-spacing:-.05em;margin-top:9px;line-height:1}
.stat small{color:var(--muted-2);font-size:11px}
.section{margin-bottom:32px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:15px;flex-wrap:wrap}
.section-head h3{margin:0;font-size:18px;letter-spacing:-.03em;font-weight:800;display:flex;align-items:center;gap:9px}
.section-head h3 .ic{color:var(--lime)}
.section-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
.link-btn{border:0;background:transparent;color:var(--lime);font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.link-btn:hover{text-decoration:underline}

/* ---------- collection cards ---------- */
.col-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
.collection-card{
  position:relative;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface);
  cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;text-align:left;padding:0;color:inherit;display:block;width:100%;
}
.collection-card:hover{transform:translateY(-4px);border-color:rgba(163,230,53,.32);box-shadow:0 16px 38px rgba(0,0,0,.4)}
.cc-cover{height:104px;position:relative;overflow:hidden;background:#1A1910}
.cc-cover:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px);background-size:14px 14px;opacity:.5}
.cc-cover img{width:100%;height:100%;object-fit:cover;display:block}
.cc-gloss{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(15,14,8,.65))}
.cc-menu{position:absolute;top:10px;right:10px;z-index:3;width:30px;height:30px;border-radius:10px;background:rgba(12,12,7,.65);border:1px solid rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;backdrop-filter:blur(8px)}
.cc-menu:hover{color:var(--lime)}
.cc-body{padding:0 18px 18px}
.cc-icon{
  width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:25px;margin-top:-27px;position:relative;z-index:2;
  background:#191810;border:1px solid var(--line-strong);box-shadow:0 10px 22px rgba(0,0,0,.45);
}
.cc-name{font-size:15.5px;font-weight:800;margin-top:13px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px;color:var(--muted);font-size:11.5px}
.cc-foot .ic{width:15px;height:15px;opacity:.6}
.cc-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:20px;background:rgba(255,255,255,.05);font-size:11px;font-weight:700}
.col-list{display:flex;flex-direction:column;gap:10px}
.collection-row{
  display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:17px;background:var(--surface);
  width:100%;text-align:left;color:inherit;transition:.16s;
}
.collection-row:hover{border-color:rgba(163,230,53,.3);transform:translateX(2px)}
.collection-row .cr-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;flex:none;border:1px solid var(--line)}
.collection-row .cr-main{flex:1;min-width:0}
.collection-row .cr-name{font-weight:750;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.collection-row .cr-meta{color:var(--muted);font-size:11.5px;margin-top:3px}
.collection-row .cr-actions{display:flex;gap:6px}

/* ---------- detail hero ---------- */
.detail-hero{
  position:relative;overflow:hidden;border:1px solid var(--line);border-radius:26px;margin-bottom:24px;
  background:var(--surface);
}
.detail-cover{height:150px;position:relative;background-size:cover;background-position:center}
.detail-cover:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--surface) 1%,rgba(20,19,12,.15) 70%)}
.detail-cover .pattern{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.1) 1px,transparent 1px);background-size:16px 16px;opacity:.4}
.detail-info{display:flex;align-items:flex-end;gap:16px;padding:0 26px 22px;margin-top:-42px;position:relative;z-index:2;flex-wrap:wrap}
.detail-icon{width:82px;height:82px;border-radius:24px;display:grid;place-items:center;font-size:38px;background:#191810;border:1px solid var(--line-strong);box-shadow:0 14px 34px rgba(0,0,0,.55);flex:none}
.detail-text{flex:1;min-width:180px;padding-bottom:4px}
.detail-text h2{margin:0;font-size:25px;font-weight:800;letter-spacing:-.04em}
.detail-text p{margin:5px 0 0;color:var(--muted);font-size:12.5px}
.detail-actions{display:flex;gap:8px;padding-bottom:4px;flex-wrap:wrap}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.local-search{display:flex;align-items:center;gap:9px;flex:1;min-width:210px;max-width:390px;height:41px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted-2)}
.local-search:focus-within{border-color:rgba(163,230,53,.5)}
.local-search input{flex:1;min-width:0;border:0;background:transparent;font-size:13px}
.select{
  height:41px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font-size:12.5px;font-weight:600;
}
.select:focus{border-color:rgba(163,230,53,.5)}
.result-count{color:var(--muted);font-size:12px;margin-left:auto}

/* ---------- accounts ---------- */
.account-list{display:flex;flex-direction:column;gap:10px}
.account-row{display:flex;align-items:center;gap:14px;padding:13px 15px;border:1px solid var(--line);border-radius:18px;background:var(--surface);transition:.16s}
.account-row:hover{border-color:rgba(163,230,53,.22);background:#1A1911}
.acct-logo{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;font-weight:800;font-size:15px;letter-spacing:-.04em;
  background:color-mix(in srgb,var(--logo) 18%,#17160E);border:1px solid color-mix(in srgb,var(--logo) 35%,transparent);color:var(--logo);
}
.acct-main{flex:1;min-width:0}
.acct-line1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.acct-title{font-size:14px;font-weight:750;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.acct-link{color:var(--muted-2);display:inline-flex}
.acct-link:hover{color:var(--lime)}
.acct-line2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:4px}
.acct-user{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sep{color:var(--muted-2)}
.pw{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.09em;color:#C9C8BC;background:none;border:0;padding:0;font-size:11.5px}
.pw:hover{color:var(--lime)}
.acct-tags{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;border:1px solid var(--line);color:var(--muted)}
.tag .dotc{width:7px;height:7px;border-radius:50%}
.tag.none{color:#D8B46A;border-color:rgba(216,180,106,.25);background:rgba(216,180,106,.07)}
.date{color:var(--muted-2);font-size:10.5px}
.acct-actions{display:flex;align-items:center;gap:5px;flex:none}
.acct-actions .icon-btn.small{border-color:transparent;background:transparent}
.acct-actions .icon-btn.small:hover{background:var(--surface-3)}
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;
  border:1px dashed var(--line-strong);border-radius:22px;padding:44px 22px;background:rgba(255,255,255,.015);
}
.empty-icon{width:58px;height:58px;border-radius:19px;display:grid;place-items:center;background:var(--lime-dim);color:var(--lime)}
.empty-icon .ic{width:26px;height:26px}
.empty h4{margin:0;font-size:16px;font-weight:800}
.empty p{margin:0;color:var(--muted);font-size:12.5px;max-width:340px;line-height:1.6}
.empty .btn{margin-top:6px}

/* ---------- search ---------- */
.search-summary{display:flex;align-items:center;gap:9px;margin-bottom:20px;color:var(--muted);font-size:13px}
.search-summary b{color:var(--lime)}
mark{background:rgba(163,230,53,.22);color:var(--lime);border-radius:4px;padding:0 2px}

/* ---------- modals ---------- */
.modal-backdrop{
  position:fixed;inset:0;z-index:100;background:rgba(5,5,3,.74);backdrop-filter:blur(7px);
  display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .16s ease;
}
.modal{
  width:min(560px,100%);max-height:min(90dvh,940px);overflow-y:auto;background:#17160E;
  border:1px solid var(--line-strong);border-radius:26px;box-shadow:var(--shadow);animation:pop .2s ease;
}
@keyframes pop{from{transform:scale(.97) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal.wide{width:min(640px,100%)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:22px 24px 16px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.03em}
.modal-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
.modal-body{padding:22px 24px}
.modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:9px;padding:16px 24px 22px;flex-wrap:wrap}
.modal-foot .left{margin-right:auto}
.field{margin-bottom:16px}
.field label{display:block;font-size:11.5px;font-weight:750;color:var(--muted);margin-bottom:7px;letter-spacing:.02em}
.field input,.field textarea,.field select{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#111009;color:var(--text);font-size:13.5px;transition:.15s;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(163,230,53,.55);box-shadow:0 0 0 3px rgba(163,230,53,.08)}
.field textarea{resize:vertical;min-height:74px}
.field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat}
.field-hint{font-size:11px;color:var(--muted-2);margin-top:6px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.icon-picker{display:grid;grid-template-columns:repeat(9,1fr);gap:7px}
.icon-picker button{aspect-ratio:1;border:1px solid var(--line);border-radius:11px;background:#111009;font-size:19px;display:grid;place-items:center;transition:.14s}
.icon-picker button:hover{border-color:rgba(163,230,53,.4)}
.icon-picker button.active{background:var(--lime-dim);border-color:var(--lime);box-shadow:0 0 0 2px rgba(163,230,53,.12)}
.color-picker{display:flex;gap:9px;flex-wrap:wrap}

    if (fps.has(fp)) return false; /* protection against duplicated imports/moves */

    if (!colIds.has(a.collectionId)) a.collectionId = null;
    return true;
  });
  d.settings = Object.assign({collectionView:"grid", lastBackupAt:null}, d.settings || {});
  d.version = SCHEMA;
  return d;
}
function load(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) { const seeded = seedData(); localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded)); return seeded; }
    return ensureIntegrity(JSON.parse(raw));
  } catch(e){ console.warn("Vault load failed", e); return ensureIntegrity(seedData()); }
}

function accountById(id){ return data.accounts.find(a => a.id === id) || null; }
function countIn(id){ return data.accounts.filter(a => a.collectionId === id).length; }
function unassigned(){ return data.accounts.filter(a => !a.collectionId); }
function initials(s){ return String(s || "?").trim().split(/\s+/).slice(0,2).map(w => w[0] || "").join("").toUpperCase() || "?"; }
function colorFor(s){ let h = 0; for (let i=0;i<String(s).length;i++) h = (h*31 + String(s).charCodeAt(i)) % 360; return "hsl(" + h + " 72% 68%)"; }
function hexToRgba(hex, a){ const h = /^#[0-9a-fA-F]{6}$/.test(hex||"") ? hex : "#A3E635"; const n = parseInt(h.slice(1),16); return "rgba(" + ((n>>16)&255) + "," + ((n>>8)&255) + "," + (n&255) + "," + a + ")"; }
function fmtDate(iso){ const d = new Date(iso); if (isNaN(d)) return ""; return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }
function safeUrl(u){ const s = String(u||"").trim(); return /^https?:\/\//i.test(s) ? s : (/^[a-z0-9.-]+\.[a-z]{2,}/i.test(s) ? "https://" + s : ""); }
function toast(msg, type){
  const el = document.createElement("div");
  el.className = "toast" + (type === "error" ? " error" : "");
  el.innerHTML = icon(type === "error" ? "alert" : "check") + "<span>" + esc(msg) + "</span>";
  $("#toastRoot").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transform = "translateX(16px)"; el.style.transition = ".25s"; setTimeout(()=>el.remove(), 260); }, 3000);
}
function copyText(text, label){
  if (!text) { toast("Nothing to copy", "error"); return; }
  const fallback = () => {
    const t = document.createElement("textarea"); t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); toast(label + " copied to clipboard"); } catch(e){ toast("Copy failed", "error"); }
    t.remove();
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(()=>toast(label + " copied to clipboard")).catch(fallback);
  else fallback();
}
function highlight(text, q){
  const s = esc(text || "");
  if (!q) return s;
  const safe = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return s.replace(new RegExp("(" + safe + ")", "ig"), "<mark>$1</mark>");
}

function confirmModal(title, message, label, onConfirm){
  ui.pendingConfirm = onConfirm;
  openModal(modalHead(title, "Please confirm this action") +
    '<div class="modal-body"><div class="note warn-note">' + icon("alert") + "<span>" + esc(message) + "</span></div></div>" +

function handleCoverFile(file){
  if (!file) return;
  if (!/^image\//.test(file.type)) { toast("Please choose an image file.", "error"); return; }
  if (file.size > 4 * 1024 * 1024) { toast("Image is larger than 4 MB.", "error"); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxW = 900, scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#17160E"; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      ui.modalDraft.cover = canvas.toDataURL("image/jpeg", .78);
      const drop = $("#coverDrop");
      if (drop) drop.innerHTML = '<img id="coverPreview" src="' + esc(ui.modalDraft.cover) + '" alt="Cover preview"/><button type="button" class="icon-btn cover-remove" data-action="remove-cover" title="Remove cover">' + icon("close","sm") + '</button><span class="cover-inner" style="opacity:0">' + icon("image") + '</span><input type="file" id="colCoverFile" accept="image/*" />';
      toast("Cover image added");
    };
    img.onerror = () => toast("Could not read this image.", "error");
    img.src = String(reader.result);
  };
  reader.readAsDataURL(file);
}
function saveCollectionForm(e){
  e.preventDefault();
  const name = $("#colName").value.trim();
  if (!name){ toast("Please enter a collection name.", "error"); return; }
  const iconV = $("#colIcon").value || "📁", colorV = $("#colColor").value || COLORS[0];
  const duplicate = data.collections.find(c => norm(c.name) === norm(name) && c.id !== ui.modalDraft.id);
  if (duplicate){ toast("A collection with this name already exists.", "error"); return; }
  if (ui.modalDraft.id){
    const c = collectionById(ui.modalDraft.id);
    if (!c) return closeModal();
    Object.assign(c, {name, icon:iconV, color:colorV, cover:ui.modalDraft.cover || null});
    toast("Collection updated — all accounts kept");
  } else {
    data.collections.push({id:uid("col"), name, icon:iconV, color:colorV, cover:ui.modalDraft.cover || null, createdAt:new Date().toISOString()});
    toast("Collection “" + name + "” created");
  }
  if (!persist()) return;
  closeModal(); renderAll();
}
function deleteCollection(id){
  const c = collectionById(id);
  if (!c) return;
  const n = countIn(id);
  confirmModal("Delete “" + c.name + "”?",
    "The collection and its cover will be removed. Its " + n + " account(s) will NOT be deleted — they will be moved to Unassigned Accounts.",
    "Delete Collection", () => {
      data.collections = data.collections.filter(x => x.id !== id);
      data.accounts.forEach(a => { if (a.collectionId === id) { a.collectionId = null; a.updatedAt = new Date().toISOString(); } });
      persist(); closeModal();
      if (ui.view === "collection" && ui.collectionId === id) setView("collections");
      else renderAll();
      toast("Collection deleted · " + n + " account(s) moved to Unassigned");
    });
}

function generatePassword(){
  const chars = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*?";
  const arr = new Uint32Array(18);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(arr); else for(let i=0;i<arr.length;i++) arr[i] = Math.floor(Math.random()*chars.length);
  $("#accPass").value = Array.from(arr, n => chars[n % chars.length]).join("");
  $("#accPass").type = "text";
  toast("Strong password generated");
}

function backupPayload(){
  return {app:APP_TAG, schema:SCHEMA, exportedAt:new Date().toISOString(), collections:clone(data.collections), accounts:clone(data.accounts), settings:clone(data.settings)};
}
function backupModal(){
  const payload = backupPayload();
  const size = (new Blob([JSON.stringify(payload)]).size / 1024).toFixed(1);
  openModal(modalHead("Backup & Restore", "Collections, accounts, relationships and cover images — all in one file.") +
    '<div class="modal-body"><div class="backup-grid">' +

    '<div class="radio-row"><label><input type="radio" name="importMode" value="merge" checked /> Merge with current vault</label>' +
      '<label><input type="radio" name="importMode" value="replace" /> Replace current vault</label></div>' +
    '<div class="note">' + icon("shield") + '<span>Import keeps every <b>collectionId</b> relationship. Duplicate IDs and duplicate account identities are skipped automatically; accounts pointing to missing collections become Unassigned.</span></div>' +
    '<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:18px">' +
      '<button class="btn primary" data-action="export-backup">' + icon("download","sm") + " Download backup (.json)</button>" +
      '<button class="btn" data-action="copy-backup">' + icon("copy","sm") + " Copy JSON</button>" +
      '<label class="btn" style="cursor:pointer">' + icon("upload","sm") + ' Import backup<input type="file" id="importFile" accept=".json,application/json" style="display:none" /></label></div>' +
    '<div style="border-top:1px solid var(--line);margin-top:20px;padding-top:16px;display:flex;gap:9px;flex-wrap:wrap">' +
      '<button class="btn sm ghost" data-action="reset-demo">' + icon("refresh","sm") + " Reset demo data</button>" +
      '<button class="btn sm danger" data-action="clear-all">' + icon("trash","sm") + " Delete all local data</button></div>" +
    (data.settings.lastBackupAt ? '<p class="field-hint" style="margin-top:12px">Last backup: ' + esc(new Date(data.settings.lastBackupAt).toLocaleString()) + "</p>" : "") +
    '</div><div class="modal-foot"><button class="btn" data-action="close-modal">Close</button></div>', true);
}
function exportBackup(){
  const payload = backupPayload();
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "el5al-pass-backup-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  data.settings.lastBackupAt = new Date().toISOString(); save();
  toast("Backup downloaded with " + payload.accounts.length + " accounts & " + payload.collections.length + " collections");
}
function applyBackup(raw, mode){
  if (!raw || typeof raw !== "object" || (!Array.isArray(raw.accounts) && !Array.isArray(raw.collections))) throw new Error("Invalid backup file");
  const inC = Array.isArray(raw.collections) ? raw.collections.map(sanitizeCollection) : [];
  const inA = Array.isArray(raw.accounts) ? raw.accounts.map(sanitizeAccount) : [];
  const collections = mode === "replace" ? [] : clone(data.collections);
  const accounts = mode === "replace" ? [] : clone(data.accounts);
  const byIdC = new Map(collections.map(c => [c.id,c]));
  const byNameC = new Map(collections.map(c => [norm(c.name),c]));
  const idMap = new Map();
  inC.forEach(c => {
    let target = byIdC.get(c.id) || byNameC.get(norm(c.name));
    if (!target){
      target = {id:c.id, name:c.name, icon:c.icon, color:c.color, cover:c.cover, createdAt:c.createdAt};
      collections.push(target); byIdC.set(target.id,target); byNameC.set(norm(target.name),target);
    } else if (!target.cover && c.cover){ target.cover = c.cover; }
    idMap.set(c.id, target.id);
  });
  const colIds = new Set(collections.map(c => c.id));
  const byIdA = new Map(accounts.map(a => [a.id,a]));
  const fps = new Set(accounts.map(fingerprint));
  let added = 0, skipped = 0;
  inA.forEach(a => {
    let cid = a.collectionId;
    if (cid) cid = idMap.get(cid) || (colIds.has(cid) ? cid : null);
    if (cid && !colIds.has(cid)) cid = null;
    const candidate = Object.assign({}, a, {collectionId:cid || null});
    const fp = fingerprint(candidate);
    if (byIdA.has(candidate.id) || fps.has(fp)){ skipped++; return; }
    accounts.push(candidate); byIdA.set(candidate.id,candidate); fps.add(fp); added++;
  });
  data.collections = collections; data.accounts = accounts;
  if (raw.settings && typeof raw.settings === "object") data.settings = Object.assign({}, data.settings, raw.settings, {lastBackupAt:data.settings.lastBackupAt});
  data = ensureIntegrity(data);
  if (!persist()) throw new Error("Storage full");
  ui.revealed.clear(); closeModal(); setView("home");
  toast("Restore complete · " + added + " account(s) added · " + skipped + " duplicate(s) skipped");
}
function handleImportFile(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const raw = JSON.parse(String(reader.result));
      const mode = ($('#modalRoot input[name="importMode"]:checked') || {}).value || "merge";
      applyBackup(raw, mode);
    } catch(err){ toast("Import failed: " + err.message, "error"); }
  };
  reader.onerror = () => toast("Could not read backup file.", "error");
  reader.readAsText(file);
}

/* ============================ events ============================ */
document.addEventListener("click", function(e){
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const act = el.dataset.action, id = el.dataset.id;
  if (act === "backdrop"){ if (e.target === el) closeModal(); return; }
  switch(act){
    case "nav": setView(el.dataset.view, id); break;
    case "open-drawer": openDrawer(); break;
    case "close-drawer": closeDrawer(); break;
    case "create-collection": closeModal(); collectionModal(null); break;
    case "edit-collection": e.stopPropagation(); closeModal(); collectionModal(id); break;
    case "delete-collection": e.stopPropagation(); closeModal(); deleteCollection(id); break;
    case "add-account": closeModal(); accountModal(null, id || (ui.view === "collection" ? ui.collectionId : null)); break;
    case "edit-account": accountModal(id, null); break;
    case "delete-account": deleteAccount(id); break;
    case "move-account": moveModal(id); break;
    case "copy-username": { const a = accountById(id); if (a) copyText(a.username, "Username"); break; }
    case "copy-password": { const a = accountById(id); if (a) copyText(a.password, "Password"); break; }
    case "reveal": {
      if (ui.revealed.has(id)) ui.revealed.delete(id); else ui.revealed.add(id);
      const row = e.target.closest(".account-row");
      if (row){ const a = accountById(id); if (a) row.outerHTML = accountRow(a); }
      break;
    }
    case "view-mode": ui.collectionView = el.dataset.mode; persist(); renderMeta(); renderView(); break;
    case "view-mode-mobile": break;
    case "focus-search": { const g = $("#globalSearch"); g.focus(); g.scrollIntoView({block:"center",behavior:"smooth"}); break; }
    case "backup": backupModal(); break;
    case "close-modal": closeModal(); break;
    case "confirm-ok": { const fn = ui.pendingConfirm; if (fn) fn(); break; }
    case "pick-icon": {
      $("#colIcon").value = el.dataset.value;
      $("#iconPicker").querySelectorAll("button").forEach(b => b.classList.toggle("active", b === el));
      break;
    }
    case "pick-color": {
      $("#colColor").value = el.dataset.value;
      $("#colorPicker").querySelectorAll("button").forEach(b => b.classList.toggle("active", b === el));
      break;
    }
    case "remove-cover": {
      ui.modalDraft.cover = null;
      const drop = $("#coverDrop");
      if (drop) drop.innerHTML = '<span class="cover-inner">' + icon("image") + '<span>Click to upload an image · auto-compressed for local storage</span></span><input type="file" id="colCoverFile" accept="image/*" />';
      toast("Cover removed");
      break;
    }
    case "quick-icon": $("#quickIcons").querySelectorAll("button").forEach(b => b.classList.toggle("active", b === el)); break;
    case "quick-color": $("#quickColors").querySelectorAll("button").forEach(b => b.classList.toggle("active", b === el)); break;
    case "quick-create-collection": quickCreateCollection(); break;
    case "toggle-pass": { const p = $("#accPass"); p.type = p.type === "password" ? "text" : "password"; break; }
    case "generate-pass": generatePassword(); break;
    case "export-backup": exportBackup(); break;
    case "copy-backup": copyText(JSON.stringify(backupPayload()), "Backup JSON"); break;
    case "reset-demo": confirmModal("Reset demo data?", "This replaces your current collections and accounts with the original demo vault. Export a backup first if needed.", "Reset vault", () => {
      data = seedData(); persist(); closeModal(); setView("home"); toast("Demo vault restored");
    }); break;
    case "clear-all": confirmModal("Delete all local data?", "Every collection and account stored on this device will be removed permanently. Export a backup first if needed.", "Delete everything", () => {
      data = {version:SCHEMA, collections:[], accounts:[], settings:{collectionView:ui.collectionView, lastBackupAt:null}};
      persist(); closeModal(); setView("home"); toast("All local data deleted");
    }); break;
  }
});

document.addEventListener("input", function(e){
  if (e.target.id === "globalSearch"){
    ui.query = e.target.value;
    if (ui.view !== "search"){ ui.view = "search"; ui.collectionId = null; renderSidebar(); }
    $("#view").innerHTML = searchHtml(); renderMeta();
  }
  if (e.target.id === "localSearch"){
    ui.localQuery = e.target.value;
    const area = $("#resultsArea");
    if (area){ area.innerHTML = collectionResultsHtml(); }
  }
});
document.addEventListener("change", function(e){
  if (e.target.id === "sortSelect"){ ui.sort = e.target.value; const area = $("#resultsArea"); if (area) area.innerHTML = collectionResultsHtml(); }
  if (e.target.id === "accountCollection"){
    const panel = $("#quickCreate");
    if (panel) panel.style.display = e.target.value === "__create__" ? "block" : "none";
  }
  if (e.target.id === "colCoverFile") handleCoverFile(e.target.files && e.target.files[0]);
  if (e.target.id === "importFile") handleImportFile(e.target.files && e.target.files[0]);
});
document.addEventListener("submit", function(e){
  if (e.target.id === "collectionForm") saveCollectionForm(e);
  if (e.target.id === "accountForm") saveAccountForm(e);
  if (e.target.id === "moveForm") saveMoveForm(e);
});
document.addEventListener("keydown", function(e){
  if (e.key === "Escape"){ if ($("#modalRoot").innerHTML) closeModal(); else closeDrawer(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); $("#globalSearch").focus(); }
});
window.addEventListener("storage", function(e){
  if (e.key === STORAGE_KEY){ data = load(); ui.collectionView = data.settings.collectionView || ui.collectionView; renderAll(); }
});

renderAll();
})();
</script>
</body>
</html>
